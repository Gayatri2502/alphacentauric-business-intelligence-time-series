[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphacentauric-business-intelligence"
version = "1.0.0"
description = "Local market forecasting with evidence, interactive charts and R exports"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pandas==3.0.6", "numpy==2.5.3", "scipy==1.18.1", "statsmodels==0.15.0", "openpyxl==3.1.5", "xlrd==2.0.2", "reportlab==5.0.1"]

[project.scripts]
alphacentauric-bi = "alphacentauric_bi.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alphacentauric_bi = ["static/*", "data/*"]
