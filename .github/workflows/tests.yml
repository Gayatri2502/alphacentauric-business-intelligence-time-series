name: Forecasting and hosted workflow
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p 'test*.py'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run hosted server and browser workflow
        run: |
          python -m uvicorn app:app --host 127.0.0.1 --port 8015 > /tmp/bi-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8015/healthz; then break; fi
            sleep 1
          done
          npm run test:e2e
